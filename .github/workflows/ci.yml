name: ci

# CI/CD for the MongoDB management portal. Pull requests and pushes run every
# quality gate. Images are published only from a `v*` tag pushed to this
# repository, after all gates pass, and
# only through the protected `release` environment. Nothing is deployed to a
# cluster from CI; production is synced manually in Argo CD.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/mohankrishna999/mongo-portal

jobs:
  backend:
    name: Go – format, lint, unit tests, govulncheck, gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go mod verify
      - run: go vet ./... && go vet -tags integration ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Unit tests (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude-dir=test ./...

  frontend:
    name: Web – lint, typecheck, tests, build, npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration – real MongoDB (replica set, TLS, failover, import/export, killOp, shared store)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: bash test/integration/run.sh

  mongodb-oidc:
    name: MONGODB-OIDC – MongoDB Enterprise with a test identity provider
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # MongoDB Enterprise is used for development testing only.
      - run: bash test/oidc/run.sh

  manifests:
    name: GitOps – kustomize render, schema validation, IaC scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache: false }
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
      - name: Render and validate overlays
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          # The optional components, rendered on top of the dev overlay.
          mkdir -p kustomize/all
          printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../overlays/dev]\ncomponents: [../components/monitoring, ../components/autoscaling, ../components/tracing-egress]\n' > kustomize/all/kustomization.yaml
          for dir in kustomize/overlays/dev kustomize/overlays/test kustomize/overlays/prod kustomize/cluster kustomize/all; do
            env="$(echo "$dir" | tr / _)"
            kubectl kustomize "$dir" > "/tmp/rendered/$env.yaml"
            "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/melmorabity/openshift-json-schemas/main/v4.18-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json' \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "/tmp/rendered/$env.yaml"
          done
          "$(go env GOPATH)/bin/kubeconform" -strict -summary \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/*.yaml
          # Plain (non-Kustomize) manifests
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/melmorabity/openshift-json-schemas/main/v4.18-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            $(find openshift -name '*.yml')
      - name: Guardrails (no MongoDB workloads, no fixed UIDs, no privileged, no cluster RBAC from apps)
        run: |
          ! grep -nE '^kind: (StatefulSet|PersistentVolumeClaim|Secret)$' /tmp/rendered/*.yaml
          ! grep -nE 'runAsUser:|fsGroup:|privileged: true' /tmp/rendered/kustomize_overlays_*.yaml
          ! grep -nE '^kind: (ClusterRole|ClusterRoleBinding)$' /tmp/rendered/kustomize_overlays_*.yaml
      - name: Portal configuration files are valid
        working-directory: .
        run: |
          for env in dev test; do go run ./cmd/portal --check-config --config "examples/kustomize/overlays/$env/config.yaml"; done
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks
        working-directory: .
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest dir /repo --no-banner --redact

  images:
    name: Images – build, smoke test, scan, SBOM
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile
      - name: Build production and debug (linux/amd64)
        run: |
          for t in production debug; do
            docker buildx build --load --target "$t" \
              --build-arg VERSION="${GITHUB_REF_NAME}" --build-arg COMMIT="${GITHUB_SHA}" \
              -t "mongo-portal:$t" .
          done
      - name: Smoke test (arbitrary UIDs, read-only rootfs, login flow)
        run: bash test/container/smoke.sh mongo-portal:production mongo-portal:debug
      - name: Browser end-to-end test (mongosh shell, sandbox isolation)
        run: bash test/e2e/run.sh mongo-portal:production
      - name: Trivy – production (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mongo-portal:production
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy – debug (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mongo-portal:debug
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Grype – both images (fail on fixable HIGH/CRITICAL)
        run: |
          for t in production debug; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest "mongo-portal:$t" --only-fixed --fail-on high
          done
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "mongo-portal:production", format: spdx-json, output-file: sbom-production.spdx.json, upload-artifact: false }
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "mongo-portal:debug", format: spdx-json, output-file: sbom-debug.spdx.json, upload-artifact: false }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sbom-*.spdx.json

  release:
    name: Release – publish (or verify) images, sign, GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'krishnamanaiducloud/mongo-portal'
    needs: [backend, frontend, integration, mongodb-oidc, manifests, secrets, images]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Release tags are immutable: images that already exist are never
      # rebuilt or overwritten. They must have been built from this commit.
      - name: Existing images
        id: existing
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          if docker buildx imagetools inspect "$IMAGE:$v" >/dev/null 2>&1; then
            for t in "$v" "$v-debug"; do
              docker pull -q --platform linux/amd64 "$IMAGE:$t" >/dev/null
              rev="$(docker inspect "$IMAGE:$t" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
              if [ "$rev" != "$GITHUB_SHA" ]; then
                echo "$IMAGE:$t exists but was built from $rev, not $GITHUB_SHA"; exit 1
              fi
            done
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "prod=$(docker buildx imagetools inspect "$IMAGE:$v" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
            echo "debug=$(docker buildx imagetools inspect "$IMAGE:$v-debug" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.existing.outputs.exists != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push production
        id: prod
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
      - name: Build and push debug
        id: debug
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debug
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-debug
      - name: Digests
        id: d
        run: |
          echo "prod=${{ steps.prod.outputs.digest || steps.existing.outputs.prod }}" >> "$GITHUB_OUTPUT"
          echo "debug=${{ steps.debug.outputs.digest || steps.existing.outputs.debug }}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sign images (keyless, by digest)
        run: |
          cosign sign --yes "$IMAGE@${{ steps.d.outputs.prod }}"
          cosign sign --yes "$IMAGE@${{ steps.d.outputs.debug }}"
      - name: Scan published images (Trivy and Grype)
        run: |
          for d in "${{ steps.d.outputs.prod }}" "${{ steps.d.outputs.debug }}"; do
            docker run --rm aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@$d"
            docker run --rm anchore/grype:latest "$IMAGE@$d" --only-fixed --fail-on high
          done
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "${{ env.IMAGE }}@${{ steps.d.outputs.prod }}", format: spdx-json, output-file: "sbom-production.spdx.json", upload-artifact: false }
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "${{ env.IMAGE }}@${{ steps.d.outputs.debug }}", format: spdx-json, output-file: "sbom-debug.spdx.json", upload-artifact: false }
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; not changed"; exit 0
          fi
          notes="docs/release-notes/$v.md"
          [ -f "$notes" ] || notes=/dev/null
          {
            cat "$notes"
            echo
            echo "## Images"
            echo
            echo "- \`$IMAGE:$v\` \`${{ steps.d.outputs.prod }}\`"
            echo "- \`$IMAGE:$v-debug\` \`${{ steps.d.outputs.debug }}\`"
            echo
            echo "Signed with cosign (keyless). Verify: \`cosign verify $IMAGE@${{ steps.d.outputs.prod }} --certificate-identity-regexp 'https://github.com/krishnamanaiducloud/mongo-portal/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "mongo-portal $v" --notes-file release-notes.md sbom-production.spdx.json sbom-debug.spdx.json
      - name: Pin production overlay to the new digest
        if: steps.existing.outputs.exists != 'true'
        working-directory: examples/kustomize/overlays/prod
        run: |
          sed -i "0,/digest: sha256:[0-9a-f]*/s//digest: ${{ steps.d.outputs.prod }}/" kustomization.yaml
          kubectl kustomize . | grep -q "${{ steps.d.outputs.prod }}"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.existing.outputs.exists != 'true'
        with:
          branch: release/portal-${{ steps.v.outputs.version }}-digest
          title: "deploy(prod): pin mongo-portal ${{ steps.v.outputs.version }}"
          commit-message: "deploy(prod): pin mongo-portal ${{ steps.v.outputs.version }} (${{ steps.d.outputs.prod }})"
          body: |
            Pins `examples/kustomize/overlays/prod` to `${{ env.IMAGE }}@${{ steps.d.outputs.prod }}`
            (debug: `${{ steps.d.outputs.debug }}`), built from ${{ github.sha }}.
            Sync `mongo-portal-prod` manually in Argo CD after review.
          add-paths: examples/kustomize/overlays/prod/kustomization.yaml
