apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Optional horizontal autoscaling on CPU. MongoDB sessions live in the pod
# that created them: when a pod is removed on scale-down its users connect
# to MongoDB again (the Route keeps users on their pod with a cookie, and the
# session registry shows every replica's sessions). Scale-down is therefore
# slow and gradual.
resources:
  - hpa.yaml
