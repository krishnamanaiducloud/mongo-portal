apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Must match the Argo CD Application destination namespace.
namespace: mongo-portal-prod

resources:
  - ../../base

components:
  - ../../components/monitoring

configMapGenerator:
  - name: mongo-portal-config
    behavior: replace
    files:
      - config.yaml

# Production images are pinned by immutable digest (updated by the release
# pipeline). Current: mongo-portal 0.0.3 (commit b69b80c).
images:
  - name: docker.io/mohankrishna999/mongo-portal
    newName: docker.io/mohankrishna999/mongo-portal
    digest: sha256:02127f7f2b9c20e558a124174e27f55e3839c4e79e7e28f243dbf9ba22c7db2a

patches:
  - path: patch-rbac.yaml
  - path: patch-networkpolicy.yaml
