{{- $fullname := include "mongo-portal.fullname" . -}}
{{- $openshift := include "mongo-portal.openshift" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-config
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "mongo-portal.config" . | nindent 4 }}
{{- if .Values.rbacPolicy.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-rbac
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
data:
  policy.default: {{ .Values.rbacPolicy.defaultRole | quote }}
  policy.csv: |
    {{- .Values.rbacPolicy.policy | nindent 4 }}
{{- end }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongo-portal.serviceAccountName" . }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
  annotations:
    {{- if and $openshift .Values.openshift.oauthClient .Values.route.enabled }}
    # The service account is the OAuth client of the OpenShift login; only
    # redirect URIs on this Route are accepted.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ $fullname }}"}}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ and (eq .Values.platform "openshift") .Values.openshift.oauthClient }}
{{- end }}
{{- if and $openshift .Values.openshift.sccRoleBinding.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-scc
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.openshift.sccRoleBinding.clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mongo-portal.serviceAccountName" . }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
  annotations:
    {{- if and $openshift .Values.tls.enabled .Values.tls.serviceCA }}
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.tls.secretName }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "mongo-portal.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
{{- if and $openshift .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
  annotations:
    # MongoDB sessions live in the pod that opened them: keep each browser
    # on one pod.
    router.openshift.io/cookie_name: mongo_portal_affinity
    haproxy.router.openshift.io/disable_cookies: "false"
    haproxy.router.openshift.io/timeout: 120s
    haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains
    {{- with .Values.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ $fullname }}
    weight: 100
  port:
    targetPort: https
  tls:
    termination: {{ ternary "reencrypt" "edge" .Values.tls.enabled }}
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: https
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mongo-portal.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    # Removing a pod ends the MongoDB sessions it holds: scale down slowly.
    scaleDown:
      stabilizationWindowSeconds: 1800
      policies:
        - type: Pods
          value: 1
          periodSeconds: 600
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mongo-portal.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mongo-portal.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: http
{{- end }}
